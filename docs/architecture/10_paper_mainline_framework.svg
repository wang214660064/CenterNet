<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="10_paper_mainline_framework-svg-title 10_paper_mainline_framework-svg-desc">
<title id="10_paper_mainline_framework-svg-title">园区低速车双目3D检测：已验证网络主线</title>
<desc id="10_paper_mainline_framework-svg-desc">三项核心创新：质量感知深度融合、尺寸朝向约束的几何offset、2D/3D中心解耦。；在project2000的400帧验证集上，v5的Car Moderate 3D AP_R40为42.24。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">园区低速车双目3D检测：已验证网络主线</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">统一端到端图像特征、可解释SGBM几何和逐帧相机标定；红色虚线仅在训练阶段存在</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">论文主线</tspan></text>
<g filter="url(#shadow)"><g><rect x="35" y="155" width="250" height="185" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="57" y="193" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="57" dy="0">双目与标定输入</tspan></text><rect x="205" y="168" width="66" height="30" rx="15" fill="#2563EB"/><text x="238.0" y="189" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="238.0" dy="0">输入</tspan></text><text x="57" y="230" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="57" dy="0">左图 image_2</tspan><tspan x="57" dy="26">右图 image_3</tspan><tspan x="57" dy="26">逐帧 P2 / P3 标定</tspan></text></g><g><rect x="35" y="475" width="250" height="185" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="57" y="513" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="57" dy="0">训练真值（仅训练）</tspan></text><rect x="205" y="488" width="66" height="30" rx="15" fill="#2563EB"/><text x="238.0" y="509" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="238.0" dy="0">监督</tspan></text><text x="57" y="550" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="57" dy="0">2D框、3D尺寸、朝向</tspan><tspan x="57" dy="26">3D框底面中心 location</tspan><tspan x="57" dy="26">不进入推理输入</tspan></text></g><g><rect x="320" y="155" width="270" height="220" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="342" y="193" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="342" dy="0">CenterNet 图像分支</tspan></text><rect x="510" y="168" width="66" height="30" rx="15" fill="#D97706"/><text x="543.0" y="189" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="543.0" dy="0">学习</tspan></text><text x="342" y="230" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="342" dy="0">DLA-34 + DLAUp + IDAUp</tspan><tspan x="342" dy="26">共享图像特征 [64,96,320]</tspan><tspan x="342" dy="26">2D检测 / direct depth / dim / rot</tspan><tspan x="342" dy="26">2D框中心与3D投影中心分离</tspan></text></g><g><rect x="320" y="475" width="270" height="185" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="342" y="513" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="342" dy="0">StereoSGBM 几何分支</tspan></text><rect x="510" y="488" width="66" height="30" rx="15" fill="#15803D"/><text x="543.0" y="509" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="543.0" dy="0">传统</tspan></text><text x="342" y="550" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="342" dy="0">稠密视差与表面深度</tspan><tspan x="342" dy="26">有效比例、离散度、梯度质量</tspan><tspan x="342" dy="26">保留可解释的双目几何</tspan></text></g><g><rect x="625" y="125" width="330" height="270" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="647" y="163" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="647" dy="0">质量感知深度融合</tspan></text><rect x="868" y="138" width="73" height="30" rx="15" fill="#7C3AED"/><text x="904.5" y="159" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="904.5" dy="0">创新①</tspan></text><text x="647" y="200" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="647" dy="0">双尺度特征融合 + ECA注意力</tspan><tspan x="647" dy="26">目标级上下文聚合</tspan><tspan x="647" dy="26">预测 offset / uncertainty / gate</tspan><tspan x="647" dy="26">低质量或远距时回退 direct depth</tspan></text></g><g><rect x="625" y="495" width="330" height="190" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="647" y="533" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="647" dy="0">Geometry Offset v4</tspan></text><rect x="868" y="508" width="73" height="30" rx="15" fill="#15803D"/><text x="904.5" y="529" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="904.5" dy="0">创新②</tspan></text><text x="647" y="570" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="647" dy="0">尺寸 + 朝向生成表面→中心先验</tspan><tspan x="647" dy="26">质量 × 几何门控 × geometry offset</tspan><tspan x="647" dy="26">+ 学习残差 offset</tspan><tspan x="647" dy="26">dim / rot detach，避免反向干扰</tspan></text></g><g><rect x="990" y="150" width="330" height="245" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="1012" y="188" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1012" dy="0">Projected Center v5</tspan></text><rect x="1233" y="163" width="73" height="30" rx="15" fill="#D97706"/><text x="1269.5" y="184" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1269.5" dy="0">创新③</tspan></text><text x="1012" y="225" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1012" dy="0">2D框：bbox center + wh</tspan><tspan x="1012" dy="26">3D中心：bbox center + proj offset</tspan><tspan x="1012" dy="26">3D中心投影 + z_final + P2</tspan><tspan x="1012" dy="26">反投影得到相机坐标 x / y / z</tspan></text></g><g><rect x="990" y="515" width="330" height="170" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1012" y="553" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1012" dy="0">输出与部署边界</tspan></text><rect x="1240" y="528" width="66" height="30" rx="15" fill="#0E7490"/><text x="1273.0" y="549" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1273.0" dy="0">输出</tspan></text><text x="1012" y="590" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1012" dy="0">2D类别、置信度、2D框</tspan><tspan x="1012" dy="26">3D尺寸、朝向、相机坐标</tspan><tspan x="1012" dy="26">0～30m为园区核心3D范围</tspan><tspan x="1012" dy="26">仅教学验证，不直接控制车辆</tspan></text></g><path d="M 285 245 L 310 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="255.5" y="215.0" width="84" height="28" rx="7" fill="#FFFFFF" opacity="0.94"/><text x="297.5" y="235.0" font-size="15" font-weight="600" fill="#475569" text-anchor="middle"><tspan x="297.5" dy="0">左图特征</tspan></text><path d="M 285 565 L 310 565" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="264.0" y="535.0" width="67" height="28" rx="7" fill="#FFFFFF" opacity="0.94"/><text x="297.5" y="555.0" font-size="15" font-weight="600" fill="#475569" text-anchor="middle"><tspan x="297.5" dy="0">左右图</tspan></text><path d="M 590 265 L 615 265" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="560.5" y="235.0" width="84" height="28" rx="7" fill="#FFFFFF" opacity="0.94"/><text x="602.5" y="255.0" font-size="15" font-weight="600" fill="#475569" text-anchor="middle"><tspan x="602.5" dy="0">图像特征</tspan></text><path d="M 590 570 L 615 590" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="543.5" y="550.0" width="118" height="28" rx="7" fill="#FFFFFF" opacity="0.94"/><text x="602.5" y="570.0" font-size="15" font-weight="600" fill="#475569" text-anchor="middle"><tspan x="602.5" dy="0">SGBM质量</tspan></text><path d="M 955 265 L 980 265" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="900.0" y="235.0" width="135" height="28" rx="7" fill="#FFFFFF" opacity="0.94"/><text x="967.5" y="255.0" font-size="15" font-weight="600" fill="#475569" text-anchor="middle"><tspan x="967.5" dy="0">z_final</tspan></text><path d="M 955 590 L 980 600" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="925.5" y="565.0" width="84" height="28" rx="7" fill="#FFFFFF" opacity="0.94"/><text x="967.5" y="585.0" font-size="15" font-weight="600" fill="#475569" text-anchor="middle"><tspan x="967.5" dy="0">几何先验</tspan></text><path d="M 1155 395 L 1155 505" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="1113.0" y="420.0" width="84" height="28" rx="7" fill="#FFFFFF" opacity="0.94"/><text x="1155.0" y="440.0" font-size="15" font-weight="600" fill="#475569" text-anchor="middle"><tspan x="1155.0" dy="0">3D结果</tspan></text><path d="M 160 475 L 160 420 L 790 420 L 790 395" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="9 7"/><text x="800" y="410" font-size="15" font-weight="600" fill="#DC2626" text-anchor="start"><tspan x="800" dy="0">训练损失</tspan></text><path d="M 160 475 L 160 710 L 1155 710 L 1155 695" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="9 7"/><text x="1165" y="700" font-size="15" font-weight="600" fill="#DC2626" text-anchor="start"><tspan x="1165" dy="0">仅训练期监督</tspan></text></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">三项核心创新：质量感知深度融合、尺寸朝向约束的几何offset、2D/3D中心解耦。</tspan><tspan x="74" dy="25">在project2000的400帧验证集上，v5的Car Moderate 3D AP_R40为42.24。</tspan></text>
