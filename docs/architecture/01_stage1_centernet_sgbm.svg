<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="01_stage1_centernet_sgbm-svg-title 01_stage1_centernet_sgbm-svg-desc">
<title id="01_stage1_centernet_sgbm-svg-title">阶段1：CenterNet 2D检测 + SGBM双目测距</title>
<desc id="01_stage1_centernet_sgbm-svg-desc">CenterNet负责“哪里有车”，SGBM负责“车离多远”，最后在2D框里做稳健取值。；限制：SGBM更接近可见表面，并不等于3D框中心深度。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">阶段1：CenterNet 2D检测 + SGBM双目测距</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">先把检测、几何测距、可视化和JSON输出跑通，不训练新的3D网络</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">阶段1</tspan></text>
<g filter="url(#shadow)"><g><rect x="55" y="170" width="275" height="150" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="77" y="208" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="77" dy="0">左图 image_2</tspan></text><rect x="243" y="183" width="73" height="30" rx="15" fill="#2563EB"/><text x="279.5" y="204" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="279.5" dy="0">输入①</tspan></text><text x="77" y="245" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="77" dy="0">单张RGB图像</tspan><tspan x="77" dy="26">用于2D目标检测</tspan></text></g><g><rect x="55" y="490" width="275" height="170" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="77" y="528" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="77" dy="0">双目与标定</tspan></text><rect x="243" y="503" width="73" height="30" rx="15" fill="#2563EB"/><text x="279.5" y="524" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="279.5" dy="0">输入②</tspan></text><text x="77" y="565" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="77" dy="0">image_2 + image_3</tspan><tspan x="77" dy="26">逐帧 P2 / P3</tspan></text></g><g><rect x="420" y="170" width="310" height="150" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="442" y="208" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="442" dy="0">CenterNet COCO</tspan></text><text x="442" y="245" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="442" dy="0">DLA-34预训练权重</tspan><tspan x="442" dy="26">类别 + 置信度 + 2D框</tspan></text></g><g><rect x="420" y="490" width="310" height="170" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="442" y="528" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="442" dy="0">StereoSGBM</tspan></text><text x="442" y="565" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="442" dy="0">计算视差</tspan><tspan x="442" dy="26">由 fx×baseline/视差 得深度</tspan></text></g><g><rect x="820" y="315" width="330" height="190" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="842" y="353" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="842" dy="0">目标框内稳健测距</tspan></text><text x="842" y="390" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="842" dy="0">取框内中下区域</tspan><tspan x="842" dy="26">中位数 + MAD过滤</tspan><tspan x="842" dy="26">保留有效深度比例</tspan></text></g><g><rect x="1240" y="270" width="300" height="280" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1262" y="308" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1262" dy="0">可观察输出</tspan></text><text x="1262" y="345" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1262" dy="0">检测叠加图</tspan><tspan x="1262" dy="26">彩色视差图</tspan><tspan x="1262" dy="26">JSON：框/距离/坐标</tspan><tspan x="1262" dy="26">风险颜色提示</tspan></text></g><path d="M 330 245 L 410 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 330 575 L 410 575" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 730 245 L 775 245 L 775 385 L 810 385" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="785" y="375" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="785" dy="0">2D框</tspan></text><path d="M 730 575 L 775 575 L 775 435 L 810 435" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="785" y="425" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="785" dy="0">深度图</tspan></text><path d="M 1150 410 L 1230 410" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">CenterNet负责“哪里有车”，SGBM负责“车离多远”，最后在2D框里做稳健取值。</tspan><tspan x="74" dy="25">限制：SGBM更接近可见表面，并不等于3D框中心深度。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>