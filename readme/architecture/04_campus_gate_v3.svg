<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="04_campus_gate_v3-svg-title 04_campus_gate_v3-svg-desc">
<title id="04_campus_gate_v3-svg-title">Campus Gate v3：按照园区距离分层训练</title>
<desc id="04_campus_gate_v3-svg-desc">同一个gate在不同距离使用不同训练权重，并重点惩罚“选错深度候选”的样本。；正式结果：Car Moderate 3D AP_R40 = 28.92。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Campus Gate v3：按照园区距离分层训练</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">把近距离安全目标放在最高优先级，远距离样本不再主导gate学习</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">v3</tspan></text>
<g filter="url(#shadow)"><g><rect x="50" y="170" width="300" height="190" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="72" y="208" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="72" dy="0">Fusion Gate v2主体</tspan></text><rect x="270" y="183" width="66" height="30" rx="15" fill="#64748B"/><text x="303.0" y="204" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="303.0" dy="0">继承</tspan></text><text x="72" y="245" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="72" dy="0">双尺度融合</tspan><tspan x="72" dy="26">质量编码 + ECA</tspan><tspan x="72" dy="26">offset / uncertainty / gate</tspan></text></g><g><rect x="50" y="500" width="300" height="190" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="72" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="72" dy="0">两种深度候选</tspan></text><text x="72" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="72" dy="0">z_stereo_corrected</tspan><tspan x="72" dy="26">z_direct</tspan><tspan x="72" dy="26">比较各自GT误差</tspan></text></g><g><rect x="430" y="150" width="300" height="150" rx="16" fill="#FFF8D9" stroke="#A16207" stroke-width="2.5"/><text x="452" y="188" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="452" dy="0">0～15m</tspan></text><text x="452" y="225" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="452" dy="0">核心近距</tspan><tspan x="452" dy="26">训练权重 2.0</tspan></text></g><g><rect x="430" y="325" width="300" height="150" rx="16" fill="#FFF8D9" stroke="#A16207" stroke-width="2.5"/><text x="452" y="363" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="452" dy="0">15～30m</tspan></text><text x="452" y="400" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="452" dy="0">核心规划距离</tspan><tspan x="452" dy="26">训练权重 1.5</tspan></text></g><g><rect x="430" y="500" width="300" height="150" rx="16" fill="#FFF8D9" stroke="#A16207" stroke-width="2.5"/><text x="452" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="452" dy="0">30～50m</tspan></text><text x="452" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="452" dy="0">远距预警</tspan><tspan x="452" dy="26">训练权重 0.5</tspan></text></g><g><rect x="800" y="230" width="330" height="260" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="822" y="268" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="822" dy="0">代价加权Focal Gate</tspan></text><text x="822" y="305" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="822" dy="0">错误选择代价越大 → 权重越高</tspan><tspan x="822" dy="26">误差差 &lt; 0.2m → 忽略</tspan><tspan x="822" dy="26">gamma=2，最大regret=4</tspan></text></g><g><rect x="800" y="545" width="330" height="150" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="822" y="583" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="822" dy="0">50m以上</tspan></text><text x="822" y="620" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="822" dy="0">gate强制为0</tspan><tspan x="822" dy="26">只保留2D观察用途</tspan></text></g><g><rect x="1210" y="275" width="330" height="270" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1232" y="313" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1232" dy="0">园区安全输出</tspan></text><text x="1232" y="350" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1232" dy="0">0～30m：核心3D检测</tspan><tspan x="1232" dy="26">30～50m：粗深度预警</tspan><tspan x="1232" dy="26">质量/不确定性不满足</tspan><tspan x="1232" dy="26">→ 回退direct dep</tspan></text></g><path d="M 350 250 L 390 250 L 390 225 L 420 225" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 350 595 L 420 400" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 730 225 L 790 300" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 730 400 L 790 360" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 730 575 L 790 420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1130 360 L 1200 390" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1130 620 L 1200 500" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">同一个gate在不同距离使用不同训练权重，并重点惩罚“选错深度候选”的样本。</tspan><tspan x="74" dy="25">正式结果：Car Moderate 3D AP_R40 = 28.92。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>