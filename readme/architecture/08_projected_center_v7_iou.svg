<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="08_projected_center_v7_iou-svg-title 08_projected_center_v7_iou-svg-desc">
<title id="08_projected_center_v7_iou-svg-title">Projected Center v7：用车辆尺度归一化中心重叠误差</title>
<desc id="08_projected_center_v7_iou-svg-desc">v7从v5最佳权重开始，保留像素损失并加入0.2权重的可导重叠代理损失。；当前状态：代码完成待训练，正式结论以project2000的400帧A/B评估为准。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Projected Center v7：用车辆尺度归一化中心重叠误差</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">比纯米制XY平均误差更接近3D IoU：小车辆对同样偏移更敏感，大车辆容忍度更高</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">v7</tspan></text>
<g filter="url(#shadow)"><g><rect x="45" y="150" width="300" height="185" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="67" y="188" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">v5投影中心头</tspan></text><rect x="224" y="163" width="107" height="30" rx="15" fill="#D97706"/><text x="277.5" y="184" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="277.5" dy="0">唯一可训练</tspan></text><text x="67" y="225" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">输出proj dx/dy</tspan><tspan x="67" dy="26">其余v5模块全部冻结</tspan><tspan x="67" dy="26">只训练148,226个参数</tspan></text></g><g><rect x="45" y="500" width="300" height="190" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="67" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">训练真值几何</tspan></text><text x="67" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">KITTI尺寸[h,w,l]</tspan><tspan x="67" dy="26">rotation_y朝向</tspan><tspan x="67" dy="26">生成相机X有效宽度和高度</tspan></text></g><g><rect x="420" y="145" width="335" height="210" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="442" y="183" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="442" dy="0">保留v5像素损失</tspan></text><text x="442" y="220" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="442" dy="0">预测proj offset</tspan><tspan x="442" dy="26">↔ GT proj offset</tspan><tspan x="442" dy="26">距离加权Smooth L1</tspan></text></g><g><rect x="420" y="475" width="335" height="230" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="442" y="513" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="442" dy="0">反投影到相机坐标</tspan></text><text x="442" y="550" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="442" dy="0">预测中心 + detach(z_final)</tspan><tspan x="442" dy="26">+ inverse_affine + 当帧P2</tspan><tspan x="442" dy="26">得到预测x/y与真值x/y</tspan></text></g><g><rect x="830" y="245" width="345" height="310" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="852" y="283" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="852" dy="0">尺度归一化重叠代理</tspan></text><rect x="1071" y="258" width="90" height="30" rx="15" fill="#DC2626"/><text x="1116.0" y="279" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1116.0" dy="0">v7新增</tspan></text><text x="852" y="320" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="852" dy="0">横向误差 ÷ 朝向后车辆宽度</tspan><tspan x="852" dy="26">纵向误差 ÷ 车辆高度</tspan><tspan x="852" dy="26">计算中心重叠率</tspan><tspan x="852" dy="26">无重叠时由Huber保留梯度</tspan><tspan x="852" dy="26">权重0.2</tspan></text></g><g><rect x="1250" y="280" width="300" height="245" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1272" y="318" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1272" dy="0">训练边界</tspan></text><text x="1272" y="355" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1272" dy="0">v6a XY损失关闭</tspan><tspan x="1272" dy="26">深度/尺寸/朝向均detach或冻结</tspan><tspan x="1272" dy="26">推理解码仍与v5相同</tspan><tspan x="1272" dy="26">训练后必须做400帧A/B</tspan></text></g><path d="M 345 240 L 410 240" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 345 595 L 410 595" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 345 290 L 380 290 L 380 520 L 410 520" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="390" y="510" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="390" dy="0">预测中心</tspan></text><path d="M 755 585 L 820 455" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 755 250 L 820 335" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1175 400 L 1240 400" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 830 500 L 790 500 L 790 750 L 20 750 L 20 230 L 55 230" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="9 7"/><text x="30" y="740" font-size="15" font-weight="600" fill="#DC2626" text-anchor="start"><tspan x="30" dy="0">梯度只回proj head</tspan></text></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">v7从v5最佳权重开始，保留像素损失并加入0.2权重的可导重叠代理损失。</tspan><tspan x="74" dy="25">当前状态：代码完成待训练，正式结论以project2000的400帧A/B评估为准。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>