<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="06_projected_center_v5-svg-title 06_projected_center_v5-svg-desc">
<title id="06_projected_center_v5-svg-title">Projected Center v5：分开“2D框中心”和“3D几何中心投影点”</title>
<desc id="06_projected_center_v5-svg-desc">2D框仍围绕可见框中心绘制；只有恢复3D相机坐标时才使用新的投影中心。；正式结果：Car Moderate 3D AP_R40从30.36提升到42.24。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Projected Center v5：分开“2D框中心”和“3D几何中心投影点”</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">修复单目3D检测中最关键的中心错位问题，2D框路径完全不受影响</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">v5</tspan></text>
<g filter="url(#shadow)"><g><rect x="45" y="150" width="285" height="170" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="67" y="188" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">DLA图像特征</tspan></text><rect x="226" y="163" width="90" height="30" rx="15" fill="#64748B"/><text x="271.0" y="184" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="271.0" dy="0">冻结v4</tspan></text><text x="67" y="225" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">原2D检测头保持不变</tspan><tspan x="67" dy="26">v4深度链路保持冻结</tspan></text></g><g><rect x="45" y="500" width="285" height="180" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="67" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">监督投影中心</tspan></text><text x="67" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">KITTI 3D底面中心</tspan><tspan x="67" dy="26">上移 height/2</tspan><tspan x="67" dy="26">通过当帧P2投影</tspan></text></g><g><rect x="410" y="260" width="340" height="230" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="432" y="298" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="432" dy="0">proj_center_offset头</tspan></text><rect x="670" y="273" width="66" height="30" rx="15" fill="#D97706"/><text x="703.0" y="294" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="703.0" dy="0">新增</tspan></text><text x="432" y="335" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="432" dy="0">2通道：dx / dy</tspan><tspan x="432" dy="26">目标 = 3D投影中心</tspan><tspan x="432" dy="26">− 2D框中心</tspan><tspan x="432" dy="26">仅训练148,226个参数</tspan></text></g><g><rect x="840" y="150" width="300" height="190" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="862" y="188" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="862" dy="0">2D路径</tspan></text><text x="862" y="225" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="862" dy="0">2D中心 + wh</tspan><tspan x="862" dy="26">恢复二维检测框</tspan><tspan x="862" dy="26">不使用proj offset</tspan></text></g><g><rect x="840" y="480" width="300" height="190" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="862" y="518" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="862" dy="0">3D中心路径</tspan></text><text x="862" y="555" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="862" dy="0">2D中心 + proj offset</tspan><tspan x="862" dy="26">+ z_final + P2</tspan><tspan x="862" dy="26">恢复相机x/y/z</tspan></text></g><g><rect x="1230" y="275" width="320" height="270" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1252" y="313" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1252" dy="0">最终预测</tspan></text><text x="1252" y="350" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1252" dy="0">同一目标保留两种中心</tspan><tspan x="1252" dy="26">2D框不被3D中心带偏</tspan><tspan x="1252" dy="26">3D框中心更加准确</tspan><tspan x="1252" dy="26">边缘大偏移做限幅</tspan></text></g><path d="M 330 235 L 400 325" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 330 590 L 400 420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 330 235 L 790 235 L 830 235" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="800" y="225" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="800" dy="0">原2D中心</tspan></text><path d="M 750 375 L 830 565" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1140 245 L 1180 245 L 1180 350 L 1220 350" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1140 575 L 1180 575 L 1180 470 L 1220 470" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">2D框仍围绕可见框中心绘制；只有恢复3D相机坐标时才使用新的投影中心。</tspan><tspan x="74" dy="25">正式结果：Car Moderate 3D AP_R40从30.36提升到42.24。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>