<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="02_stereo_ddd_baseline-svg-title 02_stereo_ddd_baseline-svg-desc">
<title id="02_stereo_ddd_baseline-svg-title">Stereo DDD基线：把SGBM接入可训练3D检测头</title>
<desc id="02_stereo_ddd_baseline-svg-desc">图像网络预测3D属性，双目分支只修正深度；SGBM失败时仍有direct dep兜底。；新增训练目标：depth_offset与depth_log_variance。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Stereo DDD基线：把SGBM接入可训练3D检测头</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">从“外挂测距”升级为“网络学习SGBM表面深度到3D中心深度的修正”</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">基线</tspan></text>
<g filter="url(#shadow)"><g><rect x="50" y="170" width="260" height="150" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="72" y="208" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="72" dy="0">左图RGB</tspan></text><text x="72" y="245" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="72" dy="0">384×1280</tspan><tspan x="72" dy="26">训练主图像</tspan></text></g><g><rect x="50" y="500" width="260" height="150" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="72" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="72" dy="0">SGBM输入</tspan></text><text x="72" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="72" dy="0">左右图 + P2/P3</tspan><tspan x="72" dy="26">深度图 + 质量图</tspan></text></g><g><rect x="390" y="150" width="320" height="190" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="412" y="188" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="412" dy="0">DLA-34图像骨干</tspan></text><text x="412" y="225" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="412" dy="0">输出1/4特征图</tspan><tspan x="412" dy="26">hm / wh / reg</tspan><tspan x="412" dy="26">dep / dim / rot</tspan></text></g><g><rect x="390" y="480" width="320" height="190" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="412" y="518" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="412" dy="0">早期双目融合分支</tspan></text><text x="412" y="555" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="412" dy="0">图像特征 + SGBM</tspan><tspan x="412" dy="26">depth_offset</tspan><tspan x="412" dy="26">depth_log_variance</tspan></text></g><g><rect x="800" y="315" width="330" height="210" rx="16" fill="#FFF8D9" stroke="#A16207" stroke-width="2.5"/><text x="822" y="353" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="822" dy="0">深度修正与回退</tspan></text><text x="822" y="390" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="822" dy="0">z_stereo = z_sgbm + offset</tspan><tspan x="822" dy="26">质量差：回退direct dep</tspan><tspan x="822" dy="26">不确定性描述可信程度</tspan></text></g><g><rect x="1220" y="270" width="320" height="300" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1242" y="308" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1242" dy="0">3D检测输出</tspan></text><text x="1242" y="345" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1242" dy="0">类别与2D框</tspan><tspan x="1242" dy="26">最终深度 z</tspan><tspan x="1242" dy="26">尺寸 h/w/l</tspan><tspan x="1242" dy="26">朝向 yaw</tspan><tspan x="1242" dy="26">相机坐标 x/y/z</tspan></text></g><path d="M 310 245 L 380 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 310 575 L 380 575" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 710 245 L 760 245 L 760 365 L 790 365" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="770" y="355" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="770" dy="0">direct dep</tspan></text><path d="M 710 575 L 760 575 L 760 475 L 790 475" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="770" y="465" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="770" dy="0">offset</tspan></text><path d="M 1130 420 L 1210 420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">图像网络预测3D属性，双目分支只修正深度；SGBM失败时仍有direct dep兜底。</tspan><tspan x="74" dy="25">新增训练目标：depth_offset与depth_log_variance。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>