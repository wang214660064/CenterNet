<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="03_fusion_gate_v2-svg-title 03_fusion_gate_v2-svg-desc">
<title id="03_fusion_gate_v2-svg-title">Fusion Gate v2：让网络判断SGBM什么时候可信</title>
<desc id="03_fusion_gate_v2-svg-desc">不再用固定规则简单选择深度，而是让gate连续融合SGBM修正深度与direct dep。；硬安全边界仍保留，学习gate不能绕过无效视差检查。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Fusion Gate v2：让网络判断SGBM什么时候可信</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">双尺度、质量编码、注意力、目标级上下文和可学习gate首次形成完整闭环</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">v2</tspan></text>
<g filter="url(#shadow)"><g><rect x="40" y="155" width="270" height="170" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="62" y="193" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="62" dy="0">图像特征</tspan></text><text x="62" y="230" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="62" dy="0">DLA-34输出1/4特征</tspan><tspan x="62" dy="26">同时构造1/8粗尺度</tspan></text></g><g><rect x="40" y="500" width="270" height="180" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="62" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="62" dy="0">SGBM质量编码</tspan></text><text x="62" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="62" dy="0">深度</tspan><tspan x="62" dy="26">有效比例</tspan><tspan x="62" dy="26">局部离散度</tspan><tspan x="62" dy="26">深度梯度</tspan></text></g><g><rect x="380" y="285" width="290" height="220" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="402" y="323" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="402" dy="0">双尺度融合</tspan></text><text x="402" y="360" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="402" dy="0">1/4：保留小目标细节</tspan><tspan x="402" dy="26">1/8：扩大上下文</tspan><tspan x="402" dy="26">融合后回到1/4尺度</tspan></text></g><g><rect x="750" y="285" width="260" height="220" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="772" y="323" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="772" dy="0">特征增强</tspan></text><text x="772" y="360" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="772" dy="0">ECA通道注意力</tspan><tspan x="772" dy="26">3×3 / 7×7 / 15×15</tspan><tspan x="772" dy="26">目标级上下文聚合</tspan></text></g><g><rect x="1090" y="155" width="245" height="170" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="1112" y="193" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1112" dy="0">offset</tspan></text><text x="1112" y="230" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1112" dy="0">修正SGBM表面深度</tspan><tspan x="1112" dy="26">Huber回归</tspan></text></g><g><rect x="1090" y="355" width="245" height="150" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="1112" y="393" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1112" dy="0">uncertainty</tspan></text><text x="1112" y="430" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1112" dy="0">估计修正可信度</tspan><tspan x="1112" dy="26">低质量时增大</tspan></text></g><g><rect x="1090" y="535" width="245" height="150" rx="16" fill="#FFF8D9" stroke="#A16207" stroke-width="2.5"/><text x="1112" y="573" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1112" dy="0">learned gate</tspan></text><text x="1112" y="610" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1112" dy="0">0：direct dep</tspan><tspan x="1112" dy="26">1：SGBM修正</tspan></text></g><g><rect x="1400" y="300" width="160" height="230" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1422" y="338" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1422" dy="0">连续融合</tspan></text><text x="1422" y="375" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1422" dy="0">z_final</tspan><tspan x="1422" dy="26">= gate×</tspan><tspan x="1422" dy="26">z_stereo</tspan><tspan x="1422" dy="26">+ (1-gate)×</tspan><tspan x="1422" dy="26">z_direct</tspan></text></g><path d="M 310 240 L 370 350" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 310 590 L 370 440" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 670 395 L 740 395" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1010 350 L 1050 350 L 1050 240 L 1080 240" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1010 395 L 1080 430" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1010 440 L 1050 440 L 1050 610 L 1080 610" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1335 240 L 1370 240 L 1370 370 L 1390 370" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1335 430 L 1390 415" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1335 610 L 1390 470" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">不再用固定规则简单选择深度，而是让gate连续融合SGBM修正深度与direct dep。</tspan><tspan x="74" dy="25">硬安全边界仍保留，学习gate不能绕过无效视差检查。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>