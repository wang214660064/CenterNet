<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="07_projected_center_v6a-svg-title 07_projected_center_v6a-svg-desc">
<title id="07_projected_center_v6a-svg-title">Projected Center v6a：同时优化像素误差和真实相机XY误差</title>
<desc id="07_projected_center_v6a-svg-desc">像素损失保证投影点正确，XY损失保证最终相机坐标正确；两者共同训练同一个小头。；400帧评估与v5基本持平，米制XY损失暂未带来稳定收益。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Projected Center v6a：同时优化像素误差和真实相机XY误差</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">用最终深度衡量中心偏移带来的米制误差，但通过detach保护已经验证的深度链路</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">v6a</tspan></text>
<g filter="url(#shadow)"><g><rect x="45" y="160" width="290" height="180" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="67" y="198" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">v5投影中心头</tspan></text><rect x="214" y="173" width="107" height="30" rx="15" fill="#D97706"/><text x="267.5" y="194" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="267.5" dy="0">唯一可训练</tspan></text><text x="67" y="235" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">输入：DLA图像特征</tspan><tspan x="67" dy="26">输出：dx / dy</tspan><tspan x="67" dy="26">推理结构完全不变</tspan></text></g><g><rect x="45" y="500" width="290" height="170" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="67" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">冻结的v5其他模块</tspan></text><rect x="248" y="513" width="73" height="30" rx="15" fill="#64748B"/><text x="284.5" y="534" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="284.5" dy="0">无梯度</tspan></text><text x="67" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">v4深度/gate/offset</tspan><tspan x="67" dy="26">hm/wh/reg/dim/rot</tspan><tspan x="67" dy="26">骨干与BatchNorm</tspan></text></g><g><rect x="410" y="150" width="335" height="200" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="432" y="188" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="432" dy="0">损失①：像素偏移</tspan></text><text x="432" y="225" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="432" dy="0">预测proj offset</tspan><tspan x="432" dy="26">↔ GT proj offset</tspan><tspan x="432" dy="26">距离加权Smooth L1</tspan></text></g><g><rect x="410" y="470" width="335" height="230" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="432" y="508" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="432" dy="0">反投影所需信息</tspan></text><text x="432" y="545" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="432" dy="0">center_image = inverse_affine</tspan><tspan x="432" dy="26">当帧P2标定矩阵</tspan><tspan x="432" dy="26">z_final先执行detach</tspan></text></g><g><rect x="825" y="300" width="335" height="240" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="847" y="338" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="847" dy="0">损失②：相机XY一致性</tspan></text><rect x="1039" y="313" width="107" height="30" rx="15" fill="#DC2626"/><text x="1092.5" y="334" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1092.5" dy="0">v6a新增</tspan></text><text x="847" y="375" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="847" dy="0">预测投影中心 + z_final + P2</tspan><tspan x="847" dy="26">→ 预测相机x/y</tspan><tspan x="847" dy="26">↔ GT相机x/y</tspan><tspan x="847" dy="26">Smooth L1，beta=0.2m</tspan></text></g><g><rect x="1240" y="300" width="310" height="240" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1262" y="338" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1262" dy="0">训练效果边界</tspan></text><text x="1262" y="375" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1262" dy="0">梯度只回到proj head</tspan><tspan x="1262" dy="26">深度只提供数值，不更新</tspan><tspan x="1262" dy="26">同时兼顾像素与米制误差</tspan><tspan x="1262" dy="26">推理解码与v5相同</tspan></text></g><path d="M 335 245 L 400 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 335 585 L 400 585" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 335 300 L 370 300 L 370 410 L 815 410" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="400" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="380" dy="0">预测中心</tspan></text><path d="M 745 585 L 815 470" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 745 250 L 815 350" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1160 420 L 1230 420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 745 250 L 1190 250 L 1190 370 L 1230 370" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 825 500 L 780 500 L 780 735 L 20 735 L 20 250 L 60 250" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="9 7"/><text x="30" y="725" font-size="15" font-weight="600" fill="#DC2626" text-anchor="start"><tspan x="30" dy="0">梯度只回proj head</tspan></text><path d="M 410 565 L 380 565" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">像素损失保证投影点正确，XY损失保证最终相机坐标正确；两者共同训练同一个小头。</tspan><tspan x="74" dy="25">400帧评估与v5基本持平，米制XY损失暂未带来稳定收益。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>