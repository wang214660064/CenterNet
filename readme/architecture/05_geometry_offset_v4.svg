<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="05_geometry_offset_v4-svg-title 05_geometry_offset_v4-svg-desc">
<title id="05_geometry_offset_v4-svg-title">Geometry Offset v4：用尺寸和朝向解释表面到中心的距离</title>
<desc id="05_geometry_offset_v4-svg-desc">SGBM看见的是车辆表面；v4根据车辆长宽和观察角估计表面到3D中心的距离。；正式结果：Car Moderate 3D AP_R40 = 30.36。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Geometry Offset v4：用尺寸和朝向解释表面到中心的距离</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">把offset拆成“可解释几何先验 + 网络学习残差”，并阻断对dim/rot的反向影响</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">v4</tspan></text>
<g filter="url(#shadow)"><g><rect x="45" y="160" width="280" height="170" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="67" y="198" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">SGBM目标深度</tspan></text><text x="67" y="235" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">更接近可见表面</tspan><tspan x="67" dy="26">附带局部质量quality</tspan></text></g><g><rect x="45" y="500" width="280" height="180" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="67" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">3D属性头</tspan></text><rect x="245" y="513" width="66" height="30" rx="15" fill="#64748B"/><text x="278.0" y="534" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="278.0" dy="0">冻结</tspan></text><text x="67" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">尺寸 dim：h/w/l</tspan><tspan x="67" dy="26">朝向 rot：alpha</tspan><tspan x="67" dy="26">输入前执行detach</tspan></text></g><g><rect x="395" y="450" width="355" height="230" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="417" y="488" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="417" dy="0">几何表面→中心先验</tspan></text><text x="417" y="525" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="417" dy="0">geometry_offset = 0.5×</tspan><tspan x="417" dy="26">(length×|cosα|</tspan><tspan x="417" dy="26">+ width×|sinα|)</tspan><tspan x="417" dy="26">再乘quality与学习门控</tspan></text></g><g><rect x="395" y="160" width="355" height="180" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="417" y="198" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="417" dy="0">学习残差分支</tspan></text><text x="417" y="235" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="417" dy="0">图像 + SGBM融合特征</tspan><tspan x="417" dy="26">修正车窗/侧面/遮挡</tspan><tspan x="417" dy="26">输出residual_offset</tspan></text></g><g><rect x="830" y="280" width="350" height="240" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="852" y="318" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="852" dy="0">Geometry Offset组合</tspan></text><text x="852" y="355" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="852" dy="0">depth_offset =</tspan><tspan x="852" dy="26">quality×geometry_gate×先验</tspan><tspan x="852" dy="26">+ learned_residual</tspan><tspan x="852" dy="26">仍受绝对/比例限幅</tspan></text></g><g><rect x="1260" y="280" width="290" height="240" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1282" y="318" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1282" dy="0">最终深度</tspan></text><text x="1282" y="355" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1282" dy="0">z_stereo = z_sgbm</tspan><tspan x="1282" dy="26">+ depth_offset</tspan><tspan x="1282" dy="26">再由gate与direct dep融合</tspan></text></g><path d="M 325 245 L 385 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 325 590 L 385 565" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 750 250 L 820 350" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 750 565 L 820 450" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 325 245 L 790 245 L 790 400 L 820 400" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="800" y="390" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="800" dy="0">z_sgbm</tspan></text><path d="M 1180 400 L 1250 400" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">SGBM看见的是车辆表面；v4根据车辆长宽和观察角估计表面到3D中心的距离。</tspan><tspan x="74" dy="25">正式结果：Car Moderate 3D AP_R40 = 30.36。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>