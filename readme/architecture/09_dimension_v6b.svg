<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="09_dimension_v6b-svg-title 09_dimension_v6b-svg-desc">
<title id="09_dimension_v6b-svg-title">Dimension v6b：让三维尺寸按相对误差公平学习</title>
<desc id="09_dimension_v6b-svg-desc">v6b从v5最佳权重开始，只更新尺寸头；不影响检测、深度、投影中心或朝向。；当前状态：代码完成待训练，结果以project2000的400帧A/B评估为准。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">Dimension v6b：让三维尺寸按相对误差公平学习</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">只训练已有dim头，车长、高度和宽度不再因为绝对米制不同而获得不均衡的损失权重</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">v6b</tspan></text>
<g filter="url(#shadow)"><g><rect x="45" y="170" width="300" height="190" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="67" y="208" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">v5完整模型</tspan></text><rect x="265" y="183" width="66" height="30" rx="15" fill="#64748B"/><text x="298.0" y="204" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="298.0" dy="0">冻结</tspan></text><text x="67" y="245" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">骨干、2D、深度、中心、朝向</tspan><tspan x="67" dy="26">全部冻结并保持eval</tspan><tspan x="67" dy="26">不改变推理解码</tspan></text></g><g><rect x="45" y="500" width="300" height="180" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="67" y="538" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">KITTI尺寸真值</tspan></text><text x="67" y="575" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="67" dy="0">目标尺寸：[height, width, length]</tspan><tspan x="67" dy="26">每一维独立作为监督</tspan><tspan x="67" dy="26">只在训练阶段读取</tspan></text></g><g><rect x="420" y="250" width="335" height="260" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="442" y="288" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="442" dy="0">dim尺寸头</tspan></text><rect x="634" y="263" width="107" height="30" rx="15" fill="#D97706"/><text x="687.5" y="284" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="687.5" dy="0">唯一可训练</tspan></text><text x="442" y="325" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="442" dy="0">输出3通道：h / w / l</tspan><tspan x="442" dy="26">加载v5已有权重</tspan><tspan x="442" dy="26">只训练该头4个参数张量</tspan><tspan x="442" dy="26">不增加模型体量</tspan></text></g><g><rect x="830" y="220" width="350" height="310" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="852" y="258" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="852" dy="0">Dimension-aware Smooth L1</tspan></text><rect x="1059" y="233" width="107" height="30" rx="15" fill="#DC2626"/><text x="1112.5" y="254" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1112.5" dy="0">v6b新增</tspan></text><text x="852" y="295" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="852" dy="0">relative_error = (pred − gt) / gt</tspan><tspan x="852" dy="26">高度、宽度、长度按相对误差</tspan><tspan x="852" dy="26">避免车长数值更大而主导损失</tspan><tspan x="852" dy="26">beta = 0.1</tspan><tspan x="852" dy="26">沿用园区距离权重</tspan></text></g><g><rect x="1250" y="265" width="300" height="255" rx="16" fill="#E8F7FA" stroke="#0E7490" stroke-width="2.5"/><text x="1272" y="303" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1272" dy="0">训练边界</tspan></text><text x="1272" y="340" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1272" dy="0">原始dim L1权重设为0</tspan><tspan x="1272" dy="26">只启用相对尺寸损失</tspan><tspan x="1272" dy="26">深度/中心/朝向无梯度</tspan><tspan x="1272" dy="26">训练后对比尺寸MAE与3D AP</tspan></text></g><path d="M 345 265 L 410 345" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 345 590 L 410 430" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 755 380 L 820 380" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1180 380 L 1240 380" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 830 485 L 790 485 L 790 750 L 20 750 L 20 265 L 55 265" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="9 7"/><text x="30" y="740" font-size="15" font-weight="600" fill="#DC2626" text-anchor="start"><tspan x="30" dy="0">梯度只回dim头</tspan></text></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">v6b从v5最佳权重开始，只更新尺寸头；不影响检测、深度、投影中心或朝向。</tspan><tspan x="74" dy="25">当前状态：代码完成待训练，结果以project2000的400帧A/B评估为准。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>