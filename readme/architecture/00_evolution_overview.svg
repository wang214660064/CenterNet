<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
  viewBox="0 0 1600 1000" role="img" aria-labelledby="00_evolution_overview-svg-title 00_evolution_overview-svg-desc">
<title id="00_evolution_overview-svg-title">园区低速车3D检测：版本演进总览</title>
<desc id="00_evolution_overview-svg-desc">主线从“能测距”逐步演进到“能学习深度质量、几何中心和相机坐标误差”。；版本号是项目迭代号，不等同于CenterNet官方版本。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A"
                  flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="1600" height="104" fill="#0F172A"/>
<text x="58" y="55" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="58" dy="0">园区低速车3D检测：版本演进总览</tspan></text>
<text x="60" y="84" font-size="17" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="60" dy="0">每一版只解决一个主要问题，灰色旁支表示验证后没有进入主线</tspan></text>
<rect x="1390" y="28" width="150" height="48" rx="24" fill="#2563EB"/>
<text x="1465" y="60" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1465" dy="0">总览</tspan></text>
<g filter="url(#shadow)"><g><rect x="50" y="160" width="320" height="170" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.5"/><text x="72" y="198" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="72" dy="0">阶段1</tspan></text><text x="72" y="235" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="72" dy="0">2D检测 + SGBM测距</tspan><tspan x="72" dy="26">无需训练3D模型</tspan></text></g><g><rect x="420" y="160" width="320" height="170" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="442" y="198" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="442" dy="0">Stereo DDD</tspan></text><text x="442" y="235" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="442" dy="0">加入3D属性头</tspan><tspan x="442" dy="26">学习深度offset</tspan></text></g><g><rect x="790" y="160" width="320" height="170" rx="16" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2.5"/><text x="812" y="198" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="812" dy="0">Fusion Gate v2</tspan></text><text x="812" y="235" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="812" dy="0">双尺度 + 质量编码</tspan><tspan x="812" dy="26">学习融合gate</tspan></text></g><g><rect x="1160" y="160" width="320" height="170" rx="16" fill="#FFF8D9" stroke="#A16207" stroke-width="2.5"/><text x="1182" y="198" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1182" dy="0">Campus Gate v3</tspan></text><text x="1182" y="235" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1182" dy="0">距离分层 + Focal</tspan><tspan x="1182" dy="26">Moderate 3D AP 28.92</tspan></text></g><g><rect x="1160" y="480" width="320" height="170" rx="16" fill="#EAF8EF" stroke="#15803D" stroke-width="2.5"/><text x="1182" y="518" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="1182" dy="0">Geometry v4</tspan></text><text x="1182" y="555" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="1182" dy="0">尺寸/朝向几何先验</tspan><tspan x="1182" dy="26">Moderate 3D AP 30.36</tspan></text></g><g><rect x="790" y="480" width="320" height="170" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2.5"/><text x="812" y="518" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="812" dy="0">Projected v5</tspan></text><text x="812" y="555" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="812" dy="0">独立3D投影中心头</tspan><tspan x="812" dy="26">Moderate 3D AP 42.24</tspan></text></g><g><rect x="420" y="480" width="320" height="170" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="442" y="518" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="442" dy="0">Projected v6a</tspan></text><text x="442" y="555" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="442" dy="0">像素 + 相机XY损失</tspan><tspan x="442" dy="26">Moderate 3D AP 42.29</tspan></text></g><g><rect x="50" y="480" width="320" height="170" rx="16" fill="#FFF0F0" stroke="#DC2626" stroke-width="2.5"/><text x="72" y="518" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="72" dy="0">Projected v7</tspan></text><text x="72" y="555" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="72" dy="0">尺度归一化重叠损失</tspan><tspan x="72" dy="26">Moderate 3D AP 41.99</tspan></text></g><path d="M 370 245 L 410 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 740 245 L 780 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1110 245 L 1150 245" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1320 335 L 1320 465" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1160 565 L 1120 565" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M 790 565 L 750 565" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="50" y="690" width="320" height="100" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="72" y="728" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="72" dy="0">未进入主线的消融</tspan></text><rect x="290" y="703" width="66" height="30" rx="15" fill="#64748B"/><text x="323.0" y="724" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="323.0" dy="0">旁支</tspan></text><text x="72" y="765" font-size="17" font-weight="400" fill="#334155" text-anchor="start"><tspan x="72" dy="0">LightStereo、3D全解冻、Dimension v6b</tspan><tspan x="72" dy="26">均需独立评估，不替代主线</tspan></text></g><path d="M 420 650 L 360 650" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="370" y="640" font-size="15" font-weight="600" fill="#475569" text-anchor="start"><tspan x="370" dy="0">对照实验</tspan></text></g>
<rect x="48" y="800" width="1504" height="98" rx="16" fill="#F8FAFC"
      stroke="#CBD5E1" stroke-width="2"/>
<text x="74" y="832" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="74" dy="0">初学者一句话</tspan></text>
<text x="74" y="864" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start"><tspan x="74" dy="0">主线从“能测距”逐步演进到“能学习深度质量、几何中心和相机坐标误差”。</tspan><tspan x="74" dy="25">版本号是项目迭代号，不等同于CenterNet官方版本。</tspan></text>
<rect x="60" y="925" width="26" height="18" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="96" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="96" dy="0">输入/数据</tspan></text><rect x="250" y="925" width="26" height="18" rx="4" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/><text x="286" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="286" dy="0">神经网络</tspan></text><rect x="440" y="925" width="26" height="18" rx="4" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/><text x="476" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="476" dy="0">传统几何</tspan></text><rect x="630" y="925" width="26" height="18" rx="4" fill="#F2ECFF" stroke="#7C3AED" stroke-width="2"/><text x="666" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="666" dy="0">融合模块</tspan></text><rect x="820" y="925" width="26" height="18" rx="4" fill="#E8F7FA" stroke="#0E7490" stroke-width="2"/><text x="856" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="856" dy="0">输出</tspan></text><rect x="1010" y="925" width="26" height="18" rx="4" fill="#FFF0F0" stroke="#DC2626" stroke-width="2"/><text x="1046" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1046" dy="0">训练损失</tspan></text><rect x="1200" y="925" width="26" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1236" y="940" font-size="15" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1236" dy="0">冻结模块</tspan></text>
</svg>